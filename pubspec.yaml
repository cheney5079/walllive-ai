name: livewall_ai
description: Livewall AI — AI-powered dynamic wallpaper generator (Volcano Seedance). 仅面向 iOS 平台维护。
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  dio: ^5.7.0
  google_fonts: ^6.2.1
  image_picker: ^1.1.2
  video_player: ^2.9.2
  flutter_secure_storage: ^9.2.2
  shared_preferences: ^2.3.3
  cached_network_image: ^3.4.1
  uuid: ^4.5.1
  intl: ^0.19.0
  dotted_border: ^2.1.0
  path_provider: ^2.1.4
  video_thumbnail: ^0.5.3
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/env/dev.env
